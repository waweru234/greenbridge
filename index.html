<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenbridge Energy | Solar & Renewable Solutions in UK & Africa</title>

  <!-- SEO Meta -->
  <meta name="description"
    content="Greenbridge Energy provides solar, wind, battery, and smart-grid and off grid renewable energy solutions for homes and businesses across the UK and Africa." />
  <meta name="keywords"
    content="Greenbridge Energy, solar energy Africa, renewable energy UK, solar installation Kenya, clean energy solutions, wind energy, sustainable power" />
  <meta name="author" content="Greenbridge Energy Limited" />
  <meta name="application-name" content="Greenbridge Energy" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.greenbridgenergy.com/" />

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:title" content="Greenbridge Energy | Solar & Renewable Solutions in UK & Africa" />
  <meta property="og:description"
    content="Reliable solar, battery, wind, and smart-grid energy solutions for homes, businesses, and communities." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Greenbridge Energy" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:url" content="https://www.greenbridgenergy.com/" />
  <meta property="og:image" content="https://www.greenbridgenergy.com/og-image.jpg" />
  <meta property="og:image:alt" content="Greenbridge Energy renewable power installations in the UK and Africa" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Greenbridge Energy | Solar & Renewable Solutions in UK & Africa" />
  <meta name="twitter:description"
    content="Providing solar, wind, battery, and grid energy solutions across the UK and Africa." />
  <meta name="twitter:image" content="https://www.greenbridgenergy.com/og-image.jpg" />

  <!-- Favicon / Site Logo -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0f172a" />

  <!-- Structured Data (VERY IMPORTANT for SEO) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Greenbridge Energy Limited",
            "url": "https://www.greenbridgenergy.com/",
            "logo": "https://www.greenbridgenergy.com/logo.png",
            "description": "Renewable energy company providing solar, wind, and sustainable power solutions across the UK and Africa.",
            "sameAs": [
              "https://www.linkedin.com/company/greenbridge-energy",
              "https://twitter.com/greenbridgeenergy"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Greenbridge Energy",
            "url": "https://www.greenbridgenergy.com/"
          }
        ]
      }
    </script>
</head>

<body>
  <!-- App Root -->
  <noscript>
    <strong>
      JavaScript is required to run this application. Please enable it in your browser.
    </strong>
  </noscript>

  <div id="root"></div>

  <!-- Main App -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
